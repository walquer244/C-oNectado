    <style>
        h1 {
            font-size: 2.5em;
            text-transform: uppercase;

        }

        #primeira {
            padding: 100px;
            display: flex;
            align-items: flex-start;
            flex-direction: column;
            gap: 40px;
        }

        #primeira>h1 {
            margin-left: 90px;
        }

        .item {
            border-radius: 20px;
            border: 2px solid transparent;
            background: linear-gradient(black, black) padding-box linear-gradient(45deg black, rgb(0, 174, 255)) border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 300px;
            min-height: 425px;
            padding: 30px;
            line-height: 1.4em;
            text-align: justify;
        }

        .pets {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 100%;
            flex-wrap: wrap;
        }

        .item img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }

        .fotos {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .infor {
            display: none;
        }

        .aberto {
            display: block;
        }

        .botao {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
        }

        .icone {
            transition: transform 0.3s;
            color: rgb(0, 0, 0);
        }

        .rotated {
            transform: rotate(180deg);
        }
    </style>
</head>
