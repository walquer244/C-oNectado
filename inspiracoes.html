<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <link rel="stylesheet" href="style.css">
    <script src="scripty.js"></script>
    <style>
        h1 {
            font-size: 2.5em;
            text-transform: uppercase;

        }

        #primeira {
            padding: 100px;
            display: flex;
            align-items: flex-start;
            flex-direction: column;
            gap: 40px;
        }

        #primeira>h1 {
            margin-left: 90px;
        }

        .item {
            border-radius: 20px;
            /* border: 2px solid transparent;
            background: linear-gradient(black, black) padding-box linear-gradient(45deg black, rgb(0, 174, 255)) border-box; */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 300px;
            min-height: 425px;
            padding: 30px;
            line-height: 1.4em;
            text-align: justify;
        }

        .pets {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 100%;
            flex-wrap: wrap;
        }

        .item img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }

        .fotos {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .infor {
            display: none;
        }

        .aberto {
            display: block;
        }

        .botao {
            background-color: rgb(9, 135, 189);
            border-radius: 10px;
            width: 40px;
            height: 40px;
            border: none;
            cursor: pointer;
        }

        .botao>i {
            color: white;
            font-size: 24px;
        }

        .icone {
            transition: transform 0.3s;
            color: rgb(0, 0, 0);
        }

        .rotated {
            transform: rotate(180deg);
        }
    </style>
</head>

<body>
    <div class="navbar">
        <h1>Seja bem vindo ao Cãonectado</h1>
        <div class="navegacao"><a href="quemSomos.html">Home</a></div>
        <div class="navegacao"><a href="index.html">Raças</a></div>
        <div class="navegacao"><a href="doencas.html">Doenças</a></div>
        <div class="navegacao"><a href="cuidados.html">Cuidados</a></div>
        <div class="navegacao"><a href="contato.html">Contato</a></div>
        <div class="navegacao"><a href="inspiracoes.html">inspirações</a></div>
    </div>
    <section id="primeira">
        <h1>pet's infor 1</h1>
        <div class="pets">

            <div class="item">
                <img src="Aquiles.jpg" alt="">
                <div class="fotos">
                    <h2>Aquiles</h2>
                    <button class="botao">
                        <i class="icone fa-solid fa-angle-down"></i>
                    </button>
                </div>
                <div class="infor">
                    <p>
                        Dono: Felipe Ryan <br>
                        Porte: Medio/Grande
                    </p>
                </div>
            </div>

        </div>
    </section>

    <script>
        let botoes = document.querySelectorAll(".botao");

        botoes.forEach(function (botao) {
            botao.addEventListener("click", function () {

                let item = botao.closest(".item");
                let infor = item.querySelector(".infor");
                let icone = botao.querySelector(".icone");

                if (infor.classList.contains("aberto")) {
                    infor.classList.remove("aberto");
                    icone.classList.remove("rotated");
                } else {
                    infor.classList.add("aberto");
                    icone.classList.add("rotated");
                }
            })
        });
    </script>

</body>

</html>
